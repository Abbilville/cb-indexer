services:
  cb-indexer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cb-indexer
    restart: unless-stopped
    ports:
      - "43770:43770"
    environment:
      - PORT=43770
      - CB_INDEXER_AUTH_TOKEN=${CB_INDEXER_AUTH_TOKEN:-${OSS_INDEXER_AUTH_TOKEN:-}}
    volumes:
      - ./data:/app/data
      - cb-indexer-cache:/root/.cache/codebase-memory-mcp
      - cb-indexer-config:/root/.config/oss-mcp

volumes:
  cb-indexer-cache:
  cb-indexer-config:
